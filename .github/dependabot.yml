version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    groups:
      # One weekly PR for all minor/patch bumps; majors stay separate PRs.
      minor-and-patch:
        update-types: [minor, patch]
      # Security fixes (any version) arrive together in one PR.
      security:
        applies-to: security-updates
        patterns: ["*"]
